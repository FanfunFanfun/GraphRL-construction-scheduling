[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlagents-wyf"
version = "1.1.0.post1"
description = "ML-Agents release_22 with graph scheduling extensions"
readme = "README.md"
requires-python = ">=3.10.1,<=3.10.12"
license = { file = "LICENSE.md" }
authors = [{ name = "wyf" }]
dependencies = [
    "attrs>=19.3.0",
    "cattrs>=1.1.0,<1.7",
    "cloudpickle",
    "filelock>=3.4.0",
    "grpcio>=1.11.0,<=1.48.2",
    "gym>=0.21.0",
    "h5py>=2.9.0",
    "huggingface-hub>=0.14",
    "numpy>=1.23.5,<1.24.0",
    "onnx==1.15.0",
    "pettingzoo==1.15.0",
    "Pillow>=4.2.1",
    "protobuf>=3.6,<3.21",
    "pypiwin32==223; platform_system == 'Windows'",
    "PyYAML>=3.1.0",
    "six>=1.16",
    "setuptools>=68,<81",
    "tensorboard>=2.14",
    "torch>=2.1.1",
    "torch-geometric>=2.6,<2.7",
]

[project.scripts]
mlagents-learn = "mlagents.trainers.learn:main"

[project.entry-points."mlagents.trainer_type"]
default = "mlagents.plugins.trainer_type:get_default_trainer_types"

[project.entry-points."mlagents.stats_writer"]
default = "mlagents.plugins.stats_writer:get_default_stats_writers"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mlagents.trainers.torch_entities" = ["graph_data/*.CSV"]

[tool.black]
line-length = 88
target-version = ["py310"]
