behaviors:
  TarSelect:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 1280
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 512
          num_layers: 3
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    keep_checkpoints: 100
    checkpoint_interval: 5000
    max_steps: 500000
    time_horizon: 1000
    summary_freq: 1000
    threaded: false

env_settings:
  env_path: null
  base_port: 5004
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: 0

engine_settings:
  time_scale: 30.0
  no_graphics: true

checkpoint_settings:
  run_id: rgcn-scheduling
  train_model: false
  results_dir: results

torch_settings:
  device: null
